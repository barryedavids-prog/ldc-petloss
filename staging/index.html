<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>A gentle check-in after losing a pet</title>
  <meta name="description" content="Six gentle questions to help you reflect on how you've been feeling since losing a much-loved pet. Private, and takes about 2 minutes.">
  <meta property="og:title" content="Missing a much-loved pet? A gentle check-in">
  <meta property="og:description" content="Six gentle questions to help you reflect on how you've been feeling since your loss. Private, and takes about 2 minutes.">
  <meta property="og:type" content="website">

  <!-- Privacy guard: this policy tells the browser to refuse ANY network
       request to other sites (no fonts, scripts, trackers, images, fetch/XHR).
       Only our own local files may load. Even a future mistake can't leak data. -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; base-uri 'none'; form-action 'none'">

  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <!-- Shared paw-print shape, drawn by the illustrations in js/app.js -->
  <svg class="sprite" aria-hidden="true" focusable="false">
    <defs>
      <g id="ldc-paw">
        <ellipse cx="0" cy="3.2" rx="5" ry="4.2"/>
        <circle cx="-5.3" cy="-2.8" r="2.1"/><circle cx="-1.9" cy="-6.3" r="2.2"/>
        <circle cx="1.9" cy="-6.3" r="2.2"/><circle cx="5.3" cy="-2.8" r="2.1"/>
      </g>
    </defs>
  </svg>

  <div class="widget" id="widget">
    <div id="stage" class="stage">
      <noscript><p class="noscript">This check-in needs JavaScript to run. If you'd like to talk to someone, please get in touch using the contact details on this website.</p></noscript>
    </div>
    <div id="crisis" class="crisis" hidden></div>
  </div>

  <!-- Invisible area that screen readers announce (e.g. "Breathing pause started") -->
  <div id="announcer" class="sr-only" role="status" aria-live="polite"></div>

  <!-- Order matters: settings and wording first, then the logic that uses them -->
  <script src="js/config.js"></script>
  <script src="js/content.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
